[project]
name = "clipdex"
version = "0.1.0"
description = "Local AI index for a video footage library: speech, visual and action search, exposed to Claude over MCP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Wanchalerm Honghom" }]
keywords = ["video", "footage", "search", "mcp", "siglip", "whisper", "qwen", "video-editing", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.57.3,<6",
    "qwen-vl-utils>=0.0.14",
    "silero-vad>=5.1",
    "mcp>=2.3,<3",
    # Speech recognition: MLX on Apple Silicon, faster-whisper everywhere else.
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.urls]
Homepage = "https://github.com/Wanchalermhonghom/clipdex"
Repository = "https://github.com/Wanchalermhonghom/clipdex"
Issues = "https://github.com/Wanchalermhonghom/clipdex/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipdex = "clipdex.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipdex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: tests that download and run the real AI models (slow)"]
addopts = "-m 'not models'"
